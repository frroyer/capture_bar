[package]
name = "cb-annotate"
description = "Annotations on a capture: the vector layers, their undo history, and flattening them into the image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cb-core.workspace = true
thiserror.workspace = true
serde.workspace = true
# Both already come with egui (epaint draws its glyphs with them), so they add no new code.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
epaint_default_fonts = "0.37"

[dev-dependencies]
ron = "0.12"
