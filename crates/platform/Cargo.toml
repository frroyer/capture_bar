[package]
name = "cb-platform"
description = "OS backends implementing the cb-core traits (macOS, Windows, Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cb-core.workspace = true
tracing.workspace = true
raw-window-handle = "0.6"

[dev-dependencies]
cb-encode.workspace = true

# Not on Linux: this crate links GTK at build time, which NFR-1 rules out.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Other OS bindings are added during their US-1.2 spikes:
# [target.'cfg(target_os = "macos")'.dependencies]   objc2 + ScreenCaptureKit bindings
# [target.'cfg(target_os = "linux")'.dependencies]   x11rb, ashpd (portals), pipewire
