name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macOS arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build -p capture-bar --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: capture-bar-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/capture-bar
            target/${{ matrix.target }}/release/capture-bar.exe
          if-no-files-found: ignore

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
